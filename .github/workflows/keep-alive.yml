# Free Supabase projects pause after a week without visits (for example during holidays).
# This sends one tiny request every 3 days so the database stays awake.
# It reads the public settings only, using the same public key as the website.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js || true)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Database not connected yet, nothing to do."; exit 0; fi
          curl -fsS "$URL/rest/v1/site_settings?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null && echo "Database is awake."
