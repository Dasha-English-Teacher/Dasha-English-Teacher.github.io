<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrast linkers</title>
<!-- The shared look: fonts, the website's theme, and ready parts for exercises. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://dashaenglish.com/assets/theme.css">
<link rel="stylesheet" href="https://dashaenglish.com/assets/exercise.css">
<style>
  /* Only what is special to this exercise goes here. */
</style>
</head>
<body>
<main class="ex">
  <h1>Contrast linkers</h1>
  <p class="ex-lead">Choose the best word for each sentence, then press Check answers.</p>
  <div class="card" id="items"></div>
  <div class="ex-actions">
    <button class="btn btn-primary" id="check">Check answers</button>
    <button class="btn" id="show">Show answers</button>
    <button class="btn" id="again">Try again</button>
  </div>
  <p id="score" class="score" aria-live="polite"></p>
</main>

<script>
  const items = [
    { before: '', after: ' the rain, we went for a walk.', options: ['Despite', 'Although', 'Whereas'], answer: 'Despite' },
    { before: 'She stayed late ', after: ' she was exhausted.', options: ['despite', 'even though', 'nevertheless'], answer: 'even though' },
    { before: 'He loves cities, ', after: ' his sister prefers the countryside.', options: ['whereas', 'despite', 'in spite of'], answer: 'whereas' },
  ];
  const $ = (id) => document.getElementById(id);

  items.forEach((it, i) => {
    const div = document.createElement('div');
    div.className = 'q';
    div.innerHTML = `<label for="s${i}"><span class="q-num">${i + 1}.</span> ${it.before}</label>`
      + `<select id="s${i}"><option value="">Choose…</option>${it.options.map((o) => `<option>${o}</option>`).join('')}</select>`
      + `${it.after}<span class="mark" id="r${i}"></span>`;
    $('items').append(div);
  });

  $('check').addEventListener('click', () => {
    let correct = 0;
    const answers = items.map((it, i) => {
      const sel = $('s' + i);
      const ok = sel.value === it.answer;
      if (ok) correct++;
      sel.classList.toggle('is-right', ok);
      sel.classList.toggle('is-wrong', !ok);
      $('r' + i).textContent = ok ? '✓' : '✗';
      $('r' + i).className = 'mark ' + (ok ? 'is-right' : 'is-wrong');
      return { q: `${i + 1}. ${it.before}___${it.after}`, a: sel.value, ok };
    });
    $('score').textContent = `Score: ${correct} / ${items.length}`;
    // Tell the website the score and the answers.
    if (window.reportResult) reportResult(correct, items.length, answers);
  });

  $('show').addEventListener('click', () => {
    // Tell the website the student opened the answers.
    if (window.reportAnswerKeyShown) reportAnswerKeyShown();
    items.forEach((it, i) => { $('s' + i).value = it.answer; });
  });

  $('again').addEventListener('click', () => {
    items.forEach((it, i) => {
      $('s' + i).value = '';
      $('s' + i).classList.remove('is-right', 'is-wrong');
      $('r' + i).textContent = '';
    });
    $('score').textContent = '';
  });
</script>
<script src="https://dashaenglish.com/assets/report.js"></script>
</body>
</html>
